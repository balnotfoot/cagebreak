name: Build and Release Cagebreak for Debian 13

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-amd64:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout source code
      uses: actions/checkout@v4
      with:
        repository: 'project-repo/cagebreak'
        ref: 'master'

    - name: Build inside Debian 13 (Trixie) AMD64 Container
      run: |
        docker run --rm -v ${{ github.workspace }}:/workspace -w /workspace debian:trixie-slim sh -c '
          apt-get update && apt-get install -y \
            git meson ninja-build pkg-config \
            libwayland-dev wayland-protocols \
            libxkbcommon-dev libinput-dev libpixman-1-dev \
            libcairo2-dev libpango1.0-dev libudev-dev libevdev-dev \
            libgbm-dev libpciaccess-dev libegl1-mesa-dev libgles2-mesa-dev \
            libdisplay-info-dev libliftoff-dev libxml2-dev \
            libseat-dev bison flex \
            gcc g++

          export PKG_CONFIG_PATH="/usr/local/lib/$(gcc -print-multiarch)/pkgconfig:/usr/local/lib/pkgconfig:$PKG_CONFIG_PATH"

          git clone --depth=1 --branch libdrm-2.4.129 https://gitlab.freedesktop.org/mesa/drm.git /tmp/libdrm
          cd /tmp/libdrm && meson setup build -Dtests=false -Dvalgrind=disabled --buildtype=release && ninja -C build && meson install -C build && cd /workspace

          git clone --depth=1 --branch 1.24.0 https://gitlab.freedesktop.org/wayland/wayland.git /tmp/wayland
          cd /tmp/wayland && meson setup build -Ddocumentation=false -Dtests=false --buildtype=release && ninja -C build && meson install -C build && cd /workspace

          git clone --depth=1 --branch 1.47 https://gitlab.freedesktop.org/wayland/wayland-protocols.git /tmp/wayland-protocols
          cd /tmp/wayland-protocols && meson setup build --buildtype=release && ninja -C build && meson install -C build && cd /workspace

          git clone --depth=1 --branch xkbcommon-1.8.0 https://github.com/xkbcommon/libxkbcommon.git /tmp/libxkbcommon
          cd /tmp/libxkbcommon && meson setup build -Denable-docs=false -Denable-tools=false -Denable-x11=false --buildtype=release && ninja -C build && meson install -C build && cd /workspace

          git clone --depth=1 https://gitlab.freedesktop.org/pixman/pixman.git /tmp/pixman
          cd /tmp/pixman && meson setup build --buildtype=release && ninja -C build && meson install -C build && cd /workspace

          git clone --depth=1 --branch 0.20.0 https://gitlab.freedesktop.org/wlroots/wlroots.git /tmp/wlroots
          cd /tmp/wlroots && meson setup build -Dxwayland=disabled -Dexamples=false --buildtype=release && ninja -C build && meson install -C build && cd /workspace

          meson setup build-amd64 -Dxwayland=false -Dman-pages=false --buildtype=release
          ninja -C build-amd64
        '

    - name: Upload AMD64 Binary Artifact
      uses: actions/upload-artifact@v4
      with:
        name: cagebreak-debian13-amd64
        path: build-amd64/cagebreak

  build-arm64:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout source code
      uses: actions/checkout@v4
      with:
        repository: 'project-repo/cagebreak'
        ref: 'master'

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3
      with:
        platforms: arm64

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build inside Debian 13 (Trixie) ARM64 Container
      run: |
        docker run --rm --platform linux/arm64 -v ${{ github.workspace }}:/workspace -w /workspace debian:trixie-slim sh -c '
          apt-get update && apt-get install -y \
            git meson ninja-build pkg-config \
            libwayland-dev wayland-protocols \
            libxkbcommon-dev libinput-dev libpixman-1-dev \
            libcairo2-dev libpango1.0-dev libudev-dev libevdev-dev \
            libgbm-dev libpciaccess-dev libegl1-mesa-dev libgles2-mesa-dev \
            libdisplay-info-dev libliftoff-dev libxml2-dev \
            libseat-dev bison flex \
            gcc g++

          export PKG_CONFIG_PATH="/usr/local/lib/$(gcc -print-multiarch)/pkgconfig:/usr/local/lib/pkgconfig:$PKG_CONFIG_PATH"

          git clone --depth=1 --branch libdrm-2.4.129 https://gitlab.freedesktop.org/mesa/drm.git /tmp/libdrm
          cd /tmp/libdrm && meson setup build -Dtests=false -Dvalgrind=disabled --buildtype=release && ninja -C build && meson install -C build && cd /workspace

          git clone --depth=1 --branch 1.24.0 https://gitlab.freedesktop.org/wayland/wayland.git /tmp/wayland
          cd /tmp/wayland && meson setup build -Ddocumentation=false -Dtests=false --buildtype=release && ninja -C build && meson install -C build && cd /workspace

          git clone --depth=1 --branch 1.47 https://gitlab.freedesktop.org/wayland/wayland-protocols.git /tmp/wayland-protocols
          cd /tmp/wayland-protocols && meson setup build --buildtype=release && ninja -C build && meson install -C build && cd /workspace

          git clone --depth=1 --branch xkbcommon-1.8.0 https://github.com/xkbcommon/libxkbcommon.git /tmp/libxkbcommon
          cd /tmp/libxkbcommon && meson setup build -Denable-docs=false -Denable-tools=false -Denable-x11=false --buildtype=release && ninja -C build && meson install -C build && cd /workspace

          git clone --depth=1 https://gitlab.freedesktop.org/pixman/pixman.git /tmp/pixman
          cd /tmp/pixman && meson setup build --buildtype=release && ninja -C build && meson install -C build && cd /workspace

          git clone --depth=1 --branch 0.20.0 https://gitlab.freedesktop.org/wlroots/wlroots.git /tmp/wlroots
          cd /tmp/wlroots && meson setup build -Dxwayland=disabled -Dexamples=false --buildtype=release && ninja -C build && meson install -C build && cd /workspace

          meson setup build-arm64 -Dxwayland=false -Dman-pages=false --buildtype=release
          ninja -C build-arm64
        '

    - name: Upload ARM64 Binary Artifact
      uses: actions/upload-artifact@v4
      with:
        name: cagebreak-debian13-arm64
        path: build-arm64/cagebreak

  publish-release:
    needs: [build-amd64, build-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Download AMD64 Artifact
      uses: actions/download-artifact@v4
      with:
        name: cagebreak-debian13-amd64
        path: ./amd64-bin

    - name: Download ARM64 Artifact
      uses: actions/download-artifact@v4
      with:
        name: cagebreak-debian13-arm64
        path: ./arm64-bin

    - name: Organize files for Release
      run: |
        mkdir -p ./release-assets
        cp ./amd64-bin/cagebreak ./release-assets/cagebreak-debian13-amd64
        cp ./arm64-bin/cagebreak ./release-assets/cagebreak-debian13-arm64

    - name: Create or Update GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: latest
        name: "Latest Automated Build"
        body: "Automated binary compilation for Debian 13 (Trixie). Updated on ${{ github.event.head_commit.timestamp || 'Manual Trigger' }}."
        draft: false
        prerelease: true
        files: |
          ./release-assets/cagebreak-debian13-amd64
          ./release-assets/cagebreak-debian13-arm64
